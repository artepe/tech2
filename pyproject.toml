[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentech2-bridge"
version = "0.1.0"
description = "Community, read-only vehicle diagnostics UI inspired by Tech 2 workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "OpenTech2 community starter"}]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
opentech2 = "opentech2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opentech2 = ["static/*.html", "static/*.js", "static/*.css"]
